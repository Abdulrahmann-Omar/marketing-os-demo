*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
html { font-size: 15px; -webkit-text-size-adjust: 100%; }
body {
  background: var(--bg); color: var(--text);
  font-family: var(--font-ui); line-height: 1.5;

}

.h-section { font-size: 1.08rem; font-weight: 600; color: var(--text); }
.h-panel { font-size: 0.98rem; font-weight: 600; color: var(--text); display: flex; align-items: center; gap: 8px; }

.lede { font-size: 1.05rem; color: var(--text-2); max-width: 64ch; margin-block-start: 6px; }
.app {
  height: 100%;
  display: grid;
  grid-template-columns: 228px minmax(0, 1fr);
  grid-template-rows: auto auto minmax(0, 1fr);
  grid-template-areas: "honest honest" "side top" "side main";
  padding-left: max(16px, env(safe-area-inset-left, 0px));

  background: var(--bg);
}
.honest {
  grid-area: honest; display: flex; align-items: center; gap: 8px;
  min-height: 26px; padding-top: env(safe-area-inset-top, 0px);
  font-size: 0.76rem; color: var(--text-muted); white-space: nowrap; overflow: hidden;
}
.honest-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); flex: none; }
.honest-sep { opacity: 0.6; }
.honest-more { overflow: hidden; text-overflow: ellipsis; }
.side { grid-area: side; display: flex; flex-direction: column; gap: 18px; padding-block: 8px 18px; padding-inline-end: 18px; min-height: 0; overflow-y: auto; }

.logo-mark .lm-a { stroke: var(--accent); }
.logo-mark .lm-i { stroke: var(--text); }

.beta { font-size: 0.66rem; font-weight: 600; color: var(--accent-text); background: var(--accent-soft); padding: 1px 7px; border-radius: var(--r-pill); letter-spacing: 0.02em; }

.nav { display: flex; flex-direction: column; gap: 2px; }
.nav-link {
  display: flex; align-items: center; gap: 11px; padding: 8px 10px; border-radius: var(--r-md);

  transition: background var(--motion-fast) var(--motion-ease), color var(--motion-fast) var(--motion-ease);

}

.biz-mark { width: 34px; height: 34px; border-radius: var(--r-md); background: var(--hotel-sea); color: var(--hotel-sand); display: grid; place-items: center; flex: none; }
.biz-text { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; min-width: 0; }
.biz-name { font-weight: 600; font-size: 1rem; white-space: nowrap; }
.tag-fictional { font-size: 0.74rem; color: var(--text-muted); border: 1px dashed var(--border-strong); padding: 1px 8px; border-radius: var(--r-pill); white-space: nowrap; }
.top-actions { display: flex; align-items: center; gap: 8px; flex: none; }
.lang { display: inline-flex; border: 1px solid var(--border); border-radius: var(--r-pill); padding: 2px; background: var(--surface); }
.lang button { border: 0; background: transparent; padding: 4px 11px; border-radius: var(--r-pill); font-size: 0.85rem; font-weight: 600; color: var(--text-muted); }
.lang button[lang="ar"] { font-family: var(--font-ui-ar); }
.lang button[aria-pressed="true"] { background: var(--text); color: var(--surface); }
.main { grid-area: main; overflow-y: auto; overflow-x: hidden; padding: 6px 8px 40px; outline: none; min-width: 0; scroll-behavior: auto; }
.screen { max-width: 1240px; margin-inline: auto; display: flex; flex-direction: column; gap: 20px; animation: screen-in var(--motion-base) var(--motion-ease); }
@keyframes screen-in { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
.screen-head { display: flex; flex-direction: column; gap: 10px; }
.screen-head.simple { gap: 4px; }
.pain-pair { display: grid; grid-template-columns: 1fr 1.35fr; gap: 0; border: 1px solid var(--border); border-radius: var(--r-lg); background: var(--surface); overflow: hidden; }
.pain-pair p { padding: 12px 18px; font-size: 1rem; line-height: 1.45; }
.pp-pain { color: var(--text-2); background: var(--surface-2); border-inline-end: 1px solid var(--border); }
.pp-does { color: var(--text); font-weight: 500; }
.pp-label { display: block; font-size: 0.72rem; font-weight: 600; letter-spacing: 0.05em; text-transform: uppercase; margin-block-end: 2px; }
html[lang="ar"] .pp-label { text-transform: none; letter-spacing: 0; font-size: 0.8rem; }
.pp-pain .pp-label { color: var(--block); }
.pp-does .pp-label { color: var(--teal); }
@media (max-width: 1180px) {
  .app { grid-template-columns: 64px minmax(0, 1fr); }
  .bm-text, .side-foot { display: none; }
  .nav-label { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  .side { padding-inline-end: 10px; align-items: center; }
  .brandmark { padding: 0; }
  .nav-link { padding: 9px; justify-content: center; }
}
@media (max-width: 759px) {
  .app { grid-template-columns: minmax(0, 1fr); grid-template-areas: "honest" "top" "main"; }
  .honest { font-size: 0.7rem; }
  .honest-sep, .honest-more { display: none; }

    position: fixed; z-index: 30; inset-inline: 0; bottom: 0; padding: 6px 8px calc(6px + env(safe-area-inset-bottom, 0px));
    background: var(--surface); border-top: 1px solid var(--border); flex-direction: row; overflow: hidden;
  }
  .brandmark, .side-foot { display: none; }

  .top-actions .btn { padding: 7px; }
  .main { padding: 2px 0 96px; }
  .h-display { font-size: 1.65rem; }

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 7px;
  border: 1px solid transparent; border-radius: var(--r-md); padding: 8px 14px;
  font-size: 0.92rem; font-weight: 600; line-height: 1.2; white-space: nowrap; text-decoration: none;
  transition: background var(--motion-fast) var(--motion-ease), border-color var(--motion-fast) var(--motion-ease), color var(--motion-fast) var(--motion-ease), transform var(--motion-fast) var(--motion-ease);
}
.btn:active:not(:disabled) { transform: translateY(1px); }
.btn:disabled { cursor: not-allowed; opacity: 0.5; }
.btn-primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn-primary:hover:not(:disabled) { background: var(--accent-hover); }
.btn-dark { background: var(--text); color: var(--surface); }
.btn-dark:hover:not(:disabled) { background: var(--text-2); }
.btn-ghost { background: var(--surface); color: var(--text); border-color: var(--border); }
.btn-ghost:hover:not(:disabled) { border-color: var(--border-strong); background: var(--surface-2); }
.btn-quiet { background: transparent; color: var(--text-2); padding: 7px 10px; }
.btn-quiet:hover { background: var(--surface-3); color: var(--text); }
.btn-ok { background: var(--ok-soft); color: var(--ok); border-color: transparent; }
.btn-danger { background: var(--block-solid); color: var(--on-solid); }
.btn-danger-ghost { background: var(--surface); color: var(--block); border-color: var(--block); }
.btn-danger-ghost:hover:not(:disabled) { background: var(--block-soft); }
.btn-sm { padding: 5px 10px; font-size: 0.82rem; }
.btn-block { width: 100%; padding-block: 11px; }

  /* ---------- guided tour ---------- */

  /* Each step offers its next action, read from the live page state, so a click on the page counts as much as a click

  var STEPS = [
    { id: 'open', screen: 'home', target: '.dash-hero', keep: ['.dash-hero', '.flow'], phoneKeep: ['.flow'] },
    { id: 'p0', pain: 0, screen: 'brand', prep: function () { MOS.setBrand('azurine'); },
      target: function () { var s = MOS.state.setup.azurine; return s.read ? '.bs-grid' : '[data-tour="brand-read"]'; },
      keep: function () { return MOS.state.setup.azurine.uploaded ? ['.bs-library'] : ['.bs-look']; },
      phoneKeep: function () { return MOS.state.setup.azurine.uploaded ? ['.bs-library'] : ['.bs-look']; },
      next: function () {

      prep: function () { MOS.setBrand('azurine'); var r = MOS.state.reels; r.step = 3; if (!r.treatment) r.treatment = 'slow-morning'; },

    { id: 'p3', pain: 3, screen: 'publish',

      keep: function () { var p = MOS.state.publish; return p.retried.p2 ? ['#wk-p2'] : (p.posted['winter-offer'] ? ['#compose-status'] : ['.cmp-plats', '.cmp-caps']); },
      phoneKeep: function () { var p = MOS.state.publish; return p.retried.p2 ? ['#wk-p2'] : (p.posted['winter-offer'] ? ['#compose-status'] : ['.cmp-caps']); },

  MOS.tourSteps = STEPS;

  var tour = MOS.tour = { active: false, i: 0 };

  tour.next = function () { var s = STEPS[tour.i]; return s.next ? s.next() : null; };

      '<div class="tc-top"><span class="tc-count" dir="ltr">' + (tour.i + 1) + ' / ' + n + '</span><button type="button" class="tc-x" id="tour-x" data-act="tour-end" aria-label="' + esc(t('tour.exit')) + '">' + icon('x') + '</button></div>' +
      body + (act ? '<div class="tc-actrow">' + act + '</div>' : '') +
      '<div class="tc-nav"><button type="button" class="btn btn-ghost" id="tour-back" data-act="tour-back"' + (tour.i === 0 ? ' disabled' : '') + '>' + esc(t('tour.back')) + '</button>' +
      '<div class="tdots" aria-hidden="true">' + dots + '</div>' +
      (tour.i < n - 1 ? '<button type="button" class="btn btn-dark" id="tour-next" data-act="tour-next">' + esc(t('tour.next')) + '</button>' : '<span class="tc-spacer"></span>') +

  function overlap(a, b) {

  function rectOf(x, y, w, h) { return { left: x, top: y, right: x + w, bottom: y + h }; }

  /* Spotlights the step's element and puts the card where it hides neither the element to click nor the proof.
     The page is scrolled only when the step or its next action changes; the presenter's own scrolling is followed. */
  tour.place = function (fromScroll) {
    if (!tour.active) return;
    var s = STEPS[tour.i];
    var spot = document.getElementById('tour-spot'), card = document.getElementById('tour-card');
    if (!spot || !card) return;
    var sel = typeof s.target === 'function' ? s.target() : s.target;
    var el = sel ? document.querySelector(sel) : null;
    var a = tour.next();
    var avoidEl = a && a.el ? document.querySelector(a.el) : null;
    var keepSel = (typeof s.keep === 'function' ? s.keep() : s.keep) || [];
    var phone = window.innerWidth < 760;
    var vw = window.innerWidth, vh = window.innerHeight;
    if (phone && !a && el) {
      var pk0 = (typeof s.phoneKeep === 'function' ? s.phoneKeep() : s.phoneKeep) || [];
      var pe = pk0.length ? document.querySelector(pk0[0]) : null;
      if (pe) { el = pe; sel = pk0[0]; }
    }
    card.classList.toggle('docked', phone);
    if (!el) {
      spot.classList.add('none'); spot.style.cssText = '';
      card.style.cssText = phone ? '' : 'left:50%;top:50%;transform:translate(-50%,-50%)';
      return;
    }
    var main = document.getElementById('main');
    var ch = card.offsetHeight, cw = card.offsetWidth;
    var key = tour.i + '|' + sel + '|' + (a ? (a.act || a.wait) : '-') + '|' + MOS.route;
    if (!fromScroll && key !== tour._key) {
      tour._key = key;
      var mtop0 = main.getBoundingClientRect().top;
      if (phone) {
        var pks = (typeof s.phoneKeep === 'function' ? s.phoneKeep() : s.phoneKeep) || [];
        var proofEl = !a && pks.length ? document.querySelector(pks[0]) : null;
        var free = vh - ch - 16, fr = (avoidEl || proofEl || el).getBoundingClientRect();
        var want = proofEl ? mtop0 + 8 : Math.max(mtop0 + 8, free - fr.height - 10);
        if (fr.top < mtop0 + 4 || fr.bottom > free) main.scrollTop += fr.top - want;
      } else {
        var r0 = el.getBoundingClientRect(), fa = avoidEl ? avoidEl.getBoundingClientRect() : null;
        if (r0.top < mtop0 || r0.top > vh - 160) main.scrollTop += r0.top - mtop0 - 12;
        else if (fa && fa.bottom > vh - 12) main.scrollTop += Math.min(fa.bottom - vh + 24, r0.top - mtop0 - 12);
      }
    }
    var r = el.getBoundingClientRect(), pad = 8;
    var limit = phone ? vh - ch - 12 : vh - 4;
    var mtop = main.getBoundingClientRect().top;
    var top = Math.max(r.top - pad, mtop + 2), bottom = Math.min(r.bottom + pad, limit);
    spot.style.cssText = 'top:' + top + 'px;left:' + (r.left - pad) + 'px;width:' + (r.width + pad * 2) + 'px;height:' + Math.max(bottom - top, 0) + 'px';
    spot.classList.toggle('none', bottom - top < 8);
    if (phone) { card.style.cssText = ''; return; }
    if (fromScroll) return;
    var av = avoidEl ? avoidEl.getBoundingClientRect() : null;
    var side = document.querySelector('.side'), sr = side ? side.getBoundingClientRect() : null;
    var keeps = keepSel.map(function (q) { var k = document.querySelector(q); return k ? k.getBoundingClientRect() : null; });
    var ys = [Math.min(Math.max(r.top, 76), vh - ch - 20), vh - ch - 20, 90];
    var xs = [r.right + 20, r.left - cw - 20, vw - cw - 24, 24, (vw - cw) / 2];
    var best = null;
    xs.forEach(function (x, xi) {
      ys.forEach(function (y, yi) {
        if (x < 8 || x + cw > vw - 8 || y < 8 || y + ch > vh - 8) return;
        var c = rectOf(x, y, cw, ch);
        var score = overlap(c, av) * 20 + overlap(c, r) + overlap(c, sr) * 0.6 + (xi + yi) * 40;
        keeps.forEach(function (kr) { score += overlap(c, kr) * 8; });
        if (!best || score < best.score) best = { x: x, y: y, score: score };
      });
    });
    if (!best) best = { x: vw - cw - 24, y: vh - ch - 20 };
    card.style.cssText = 'left:' + Math.round(best.x) + 'px;top:' + Math.round(best.y) + 'px';
  };
  tour.key = function (ev) {
    if (MOS._dlg) return;
    var tag = (ev.target && ev.target.tagName) || '';
    if (tag === 'TEXTAREA' || tag === 'INPUT') return;
    var rtl = MOS.lang === 'ar';
    var nextKeys = rtl ? ['ArrowLeft', 'PageDown'] : ['ArrowRight', 'PageDown'];
    var backKeys = rtl ? ['ArrowRight', 'PageUp'] : ['ArrowLeft', 'PageUp'];
    if (ev.key === 'Escape') { tour.end(); ev.preventDefault(); }
    else if (nextKeys.indexOf(ev.key) >= 0) { MOS.actions['tour-next'](); ev.preventDefault(); }
    else if (backKeys.indexOf(ev.key) >= 0) { MOS.actions['tour-back'](); ev.preventDefault(); }
  };
  MOS.actions['tour-start'] = function () {
    if (JSON.stringify(MOS.state) !== JSON.stringify(initialState())) MOS.actions.reset({ quiet: true });
    tour.start(0);
  };
  MOS.actions['tour-switch'] = function () { MOS.setBrand('qirfa'); };
  /* "See ..." brings a step's second proof into view (the poster's sizes, the calendar). */
  MOS.actions['tour-see'] = function () {
    var s = STEPS[tour.i], which = s.id === 'p1' ? 'sizes' : 'cal', sel = which === 'sizes' ? '.pm-sizes' : '.dash-cal';
    MOS.state.seen[which] = true;
    var el = document.querySelector(sel), main = document.getElementById('main');
    if (el && main) main.scrollTop += el.getBoundingClientRect().top - main.getBoundingClientRect().top - 12;

    if (tour.active) tour.render();
  };
  MOS.actions['tour-open'] = function (el) { tour.start(parseInt(el.getAttribute('data-step'), 10) || 0); };
  MOS.actions['tour-end'] = function () { tour.end(); };
  MOS.actions['tour-next'] = function () { if (tour.i < STEPS.length - 1) { tour.i++; tour.show(); } else tour.end(); };
  MOS.actions['tour-back'] = function () { if (tour.i > 0) { tour.i--; tour.show(); } };
  MOS.actions['tour-do'] = function () {
    var a = tour.next(); if (!a || a.wait) return;
    var fn = MOS.actions[a.act];
    var target = (a.el && document.querySelector(a.el)) || document.body;
    if (!target.matches('[data-act="' + a.act + '"]')) target = target.querySelector('[data-act="' + a.act + '"]') || target;
    if (fn) fn(target);

  };
  window.addEventListener('resize', function () { if (tour.active) tour.place(); });

  /* ---------- boot ---------- */

  function boot() {
    document.body.insertAdjacentHTML('afterbegin', shell());
    applyLang();
    MOS.route = routeFromHash();
    renderScreen(false);
    document.getElementById('main').addEventListener('scroll', function () { if (tour.active) tour.place(true); }, { passive: true });
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot); else setTimeout(boot, 0);
})();

      else vis = '<div class="vt-frame r-' + x.ratio.replace(':', '-') + '">' + MOS.scene(x.id === 'cover' ? 'sea-view-room' : 'bay-sunrise') + (x.id === 'cover' ? '<span class="vt-cover">Morning on the bay</span>' : '') + '</div>';
      return '<li class="vtile"><div class="vt-vis">' + vis + '</div><div class="vt-meta"><span class="vt-label">' + esc(L(x.label)) + '</span><span class="mono muted" dir="ltr">' + esc(x.meta) + '</span></div></li>';
    }).join('');
    return '<div class="versions-wrap"><p class="gate-line">' + icon('check') + esc(t('reels.versionsLine')) + '</p><ul class="vtiles">' + v + '</ul></div>';
  }

  function painPanel() {
    return '<aside class="panel rp-side"><h2 class="h-panel">' + esc(t('reels.pTitle')) + '</h2><p class="muted small">' + esc(t('reels.pLine')) + '</p><ol class="plist">' +
      R.painPoints.map(function (p) {
        return '<li><span class="pl-id mono">' + p.id + '</span><div><p class="pl-pain">' + esc(L(p.pain)) + '</p><p class="pl-does">' + esc(L(p.does)) + '</p></div></li>';
      }).join('') + '</ol></aside>';
  }

  /* ---------- player engine ---------- */

  var P = { raf: 0, playing: false, last: 0, tl: null, k: -1 };

  function ease(p) { p = Math.min(1, Math.max(0, p)); return p < 0.5 ? 2 * p * p : 1 - Math.pow(-2 * p + 2, 2) / 2; }
  var FACT = { sky: 0.3, far: 0.55, mid: 0.85, near: 1.25 };

  function applyCam(layerEl, seg, p) {
    var svg = layerEl.querySelector('svg');
    if (!svg || MOS.reduced) return;
    var cam = seg.s.cam, e = ease(p);
    ['sky', 'far', 'mid', 'near'].forEach(function (k) {
      var g = svg.querySelector('.L-' + k); if (!g) return;
      var f = FACT[k], tr = '';
      if (cam.type === 'push') tr = 'scale(' + (1 + 0.03 * e * f * 1.2).toFixed(4) + ')';
      else if (cam.type === 'pan' || cam.type === 'parallax') {
        var dx = (cam.x[1] - cam.x[0]) / 100 * 1080 * e * f * -1;
        tr = 'translate(' + dx.toFixed(1) + 'px,0) scale(1.02)';
      } else if (cam.type === 'living') {
        tr = 'scale(' + (1 + 0.02 * p * (0.6 + f * 0.4)).toFixed(4) + ')';
      }
      g.style.transform = tr;
    });
  }

  function captions(seg, local) {
    var cap = document.getElementById('reel-cap'); if (!cap) return;
    var s = seg.s, span = s.end - s.start;
    var html = s.words.map(function (w) {
      var wt = (w.t - s.start) / span * seg.dur;
      var cls = local >= wt ? (local < wt + w.d / span * seg.dur ? 'now' : 'said') : '';
      return '<span class="' + cls + '">' + esc(w.w) + '</span>';
    }).join(' ');
    if (cap._h !== html) { cap.innerHTML = html; cap._h = html; }
  }

  function frame(time) {
    var tl = P.tl, stage = document.getElementById('reel-stage');
    if (!stage) { stop(); return; }
    var T = total(tl);
    var cur = st().t;
    if (cur >= T) cur = T - 0.001;
    var k = 0; for (var i = 0; i < tl.length; i++) if (cur >= tl[i].start) k = i;
    var seg = tl[k], local = cur - seg.start;
    if (k !== P.k) {
      stage.querySelectorAll('.rs').forEach(function (el) { el.classList.toggle('on', +el.getAttribute('data-k') === k); });
      P.k = k;
    }
    var layer = stage.querySelector('.rs[data-k="' + k + '"]');
    if (layer) applyCam(layer, seg, local / seg.dur);
    /* the outgoing layer keeps its last camera position while it fades */

  }

  function loop(now) {
    if (!P.playing) return;

    var s = st(), T = total(P.tl);

  }

  function setPlayingUi(on) {

    var b = document.getElementById('reel-toggle');
    if (b) { b.innerHTML = icon(on ? 'pause' : 'play'); b.setAttribute('aria-label', on ? t('reels.pause') : t('reels.play')); }
  }
  function play() {

  function pause(ended) {

  }

  MOS.reelPlayer = { play: play, pause: pause, state: P };

  /* ---------- screen ---------- */

  MOS.screens.reels = {
    render: function () {
      var s = st(), body;

      else if (s.step === 1) body = gate1();
      else if (s.step === 2) body = shotList();
      else if (s.step === 3) body = gate2();

      return MOS.painHead(2) + (MOS.state.brand !== D.reel.brand ? '<p class="readonly-note">' + icon('info') + esc(t('reels.otherBrand')) + '</p>' : '') +
        '<div class="reels-top">' + stepper() + MOS.illusNote() + '</div>' +
        '<div class="reels-layout"><div class="reels-main">' + body + '</div>' + painPanel() + '</div>';
    },
    mount: function () {
      P.k = -1;
      if (st().step === 3) { P.tl = timeline(); frame(); }
    },
    unmount: function () { stop(); }
  };

  MOS.actions['reel-step'] = function (el) {
    var i = parseInt(el.getAttribute('data-i'), 10);

  };
  MOS.actions['reel-pick'] = function (el) { st().treatment = el.getAttribute('data-id'); MOS.refresh(); };
  MOS.actions['reel-play'] = function () {

  MOS.actions['tour-shorter'] = function () {

  };
  MOS.actions['reel-toggle'] = function () { if (P.playing) pause(); else { st().played = true; play(); } };
  MOS.actions['reel-seek'] = function (el) {

  MOS.actions['reel-edit'] = function (el) {
    var id = el.getAttribute('data-id'), s = st();
    if (id === 'shorter') { s.cut = s.cut === 'c15' ? 'master' : 'c15'; s.edit = s.cut === 'c15' ? 'shorter' : null; s.t = 0; }
    else if (id === 'longer' && s.cut === 'c15') { s.cut = 'master'; s.edit = 'longer'; s.t = 0; }

  MOS.actions['reel-approve'] = function () {

  MOS.actions['reel-post'] = function () {

  };
})();

      });

      '<span class="wk-when"><span class="wk-day">' + esc(MOS.dayLabel(e.date)) + '</span><span class="mono" dir="ltr">' + esc(e.time) + '</span></span>' +

      '<label class="radio" for="when-later"><input type="radio" name="when" id="when-later" data-act="pub-when" value="later"' + (s.when !== 'now' ? ' checked' : '') + (done || ex ? ' disabled' : '') + '><span>' + esc(t('pub.at')) + '</span></label>' +
      '<label class="sr-only" for="when-time">' + esc(t('pub.time')) + '</label><select id="when-time" class="brand-select brand-select-sm" data-act="pub-time"' + (s.when === 'now' || done || ex ? ' disabled' : '') + '>' +
      TIMES.map(function (x) { return '<option value="' + x + '"' + (s.when === x ? ' selected' : '') + '>' + x + '</option>'; }).join('') + '</select><span class="muted small">' + esc(t('common.cairo')) + '</span></div>';
    var action = ex ? '<div class="cmp-done cmp-existing" id="compose-status"><p class="cmp-appr">' + icon('check') + esc(t('pub.alreadyOn', { day: MOS.dayLabel(ex.date), time: ex.time })) + '</p>' +
      '<ul class="cmp-states">' + ex.posts.map(function (x) { return '<li>' + MOS.plat(x.platform) + pill(x.status) + '</li>'; }).join('') + '</ul></div>' :
      done ? '<div class="cmp-done" id="compose-status"><p class="cmp-appr">' + icon('check') + esc(t('pub.approvedAt', { time: done.at })) + '</p>' +
      '<ul class="cmp-states">' + done.plats.map(function (pl) { return '<li>' + MOS.plat(pl) + pill(done.state[pl] || (done.when === 'now' ? 'posted' : 'scheduled')) + '</li>'; }).join('') + '</ul>' +
      (done.when === 'now' ? '<p class="muted small">' + esc(t('pub.testNote')) + '</p>' : '') + '</div>' :
      '<button type="button" class="btn btn-primary btn-lg" id="pub-approve" data-act="pub-approve"' + (plats().length ? '' : ' disabled') + '>' + icon('check') +
      esc(s.when === 'now' ? t('pub.approvePost') : t('pub.approveSchedule', { time: s.when })) + '</button><p class="muted small">' + esc(t('pub.oneClick')) + '</p>';
    return '<section class="panel compose" data-tour="compose"><div class="panel-head"><h2 class="h-panel">' + esc(t('pub.compose')) + '</h2>' +
      MOS.badge('neutral', t('common.simulated')) + '</div>' +
      '<div class="cmp-grid"><div class="cmp-col1"><h3 class="h-sub">' + esc(t('pub.fromLibrary')) + '</h3>' + lib + '<div class="cmp-preview">' + preview(item) + '</div></div>' +
      '<div class="cmp-col2"><h3 class="h-sub">' + esc(t('pub.platforms')) + '</h3>' + platList + '</div>' +
      '<div class="cmp-col3"><h3 class="h-sub">' + esc(t('pub.captions')) + '</h3>' + caps + when + '<div class="cmp-action">' + action + '</div></div></div></section>';
  }

  function statusPanel() {
    return '<section class="panel status" data-tour="status"><div class="panel-head"><h2 class="h-panel">' + esc(t('pub.statusTitle')) + '</h2>' +
      '<span class="muted small">' + esc(t('pub.statusLine')) + '</span></div><ol class="st-week">' + entries().map(function (e) { return MOS.entryRow(e); }).join('') + '</ol></section>';
  }

  function connections() {
    var b = MOS.brand();
    return '<section class="panel conns"><div class="panel-head"><h2 class="h-panel">' + esc(t('pub.connections')) + '</h2><span class="muted small">' + esc(t('pub.connLine')) + '</span></div>' +
      '<ul class="conn-list">' + D.platforms.map(function (pl) {
        var on = MOS.connected(b.id, pl.id);
        return '<li class="conn' + (on ? ' is-on' : '') + '">' + MOS.plat(pl.id) + (on ? '<span class="spill spill-ok">' + icon('check') + esc(t('pub.connected')) + '</span><span class="muted small mono" dir="ltr">' + esc(b.handle) + '</span>' :
          '<button type="button" class="btn btn-ghost btn-sm" id="conn-' + pl.id + '" data-act="pub-connect" data-id="' + pl.id + '">' + icon('plug') + esc(t('pub.connect')) + '</button>') + '</li>';
      }).join('') + '</ul><p class="muted small">' + esc(t('pub.service')) + '</p></section>';
  }

  MOS.screens.publish = {
    render: function () {
      return MOS.painHead(3) + compose() + '<div class="pub-cols">' + statusPanel() + connections() + '</div>' + MOS.calendar({ cls: 'pub-cal' });
    }
  };

  MOS.actions['pub-item'] = function (el) { var s = st(); s.item = el.getAttribute('data-id'); s.plats = null; s.when = 'now'; MOS.refresh(); };
  MOS.actions['pub-plat'] = function (el) {
    var id = el.getAttribute('data-id'), list = plats(), i = list.indexOf(id);
    if (el.checked && i < 0) list.push(id); else if (!el.checked && i >= 0) list.splice(i, 1);
    MOS.refresh();
  };
  MOS.actions['pub-when'] = function (el) { var s = st(); s.when = el.value === 'now' ? 'now' : '19:30'; MOS.refresh(); };
  MOS.actions['pub-time'] = function (el) { st().when = el.value; MOS.refresh(); };
  MOS.actions['pub-connect'] = function (el) {
    var id = el.getAttribute('data-id'), b = MOS.state.brand, c = st().connected;
    (c[b] = c[b] || {})[id] = true;
    MOS.toast(t('pub.connectedToast', { name: MOS.platform(id).name }));
    MOS.refresh();
  };
  MOS.actions['pub-approve'] = function () {
    var s = st(), item = s.item;
    if (MOS.route !== 'publish' || MOS.busy || s.posted[item] || existing(item) || !plats().length) return;
    var ep = MOS.epoch, list = plats().slice(), when = s.when;
    var done = s.posted[item] = { at: MOS.tick(1), plats: list, when: when, state: {} };
    if (when !== 'now') { MOS.toast(t('pub.scheduledToast', { time: when })); MOS.refresh(); return; }
    MOS.busy = true;
    list.forEach(function (pl) { done.state[pl] = 'posting'; });
    MOS.refresh();
    list.forEach(function (pl, i) {
      setTimeout(function () {
        if (ep !== MOS.epoch) return;
        done.state[pl] = 'posted';
        if (i === list.length - 1) MOS.busy = false;
        if (MOS.route === 'publish' || MOS.route === 'home') MOS.refresh();
      }, (MOS.reduced ? 20 : 380) * (i + 1));
    });
  };
  MOS.actions['pub-retry'] = function (el) {
    var id = el.getAttribute ? el.getAttribute('data-id') : 'p2';
    if (st().retried[id || 'p2']) return;
    st().retried[id || 'p2'] = true;
    MOS.toast(L(D.failure.retried));
    MOS.refresh();
  };
  MOS.actions['cal-view'] = function (el) { st().view = el.getAttribute('data-v'); MOS.refresh(); };
  MOS.actions['cal-brand'] = function (el) { st().calBrand = el.value; MOS.refresh(); };
})();

/* How it works: the 2.0 architecture drawn natively. The dashboard on top; the flow from brand setup through the
   poster and reel makers to "Approve and post", the posting service and every platform, with statuses coming back;
   the brand kit and library underneath; the engines; the beta platform. Hover or tap any box for one line. */
(function () {
  'use strict';
  var MOS = window.MOS, D = MOS.D, t = MOS.t, L = MOS.L, esc = MOS.esc, icon = MOS.icon;
  var A = D.architecture;
  var ICON = { brand: 'brand', posters: 'posters', reels: 'reels', approve: 'check', service: 'send', platforms: 'globe' };

  function box(key, title, line, cls, ico, show) {
    return '<button type="button" class="abox ' + (cls || '') + '" id="arch-' + key + '" data-act="how-explain" data-line="' + esc(line) + '" data-title="' + esc(title) + '">' +
      (ico ? icon(ico) : '') + '<span class="abox-t">' + esc(title) + '</span>' + (show ? '<span class="abox-l">' + esc(show) + '</span>' : '') + '</button>';
  }
  function flowBox(id) { var f = A.flow.filter(function (x) { return x.id === id; })[0]; return box(id, L(f.title), L(f.line), id === 'approve' ? 'abox-gate' : '', ICON[id], L(f.line)); }

  MOS.screens.how = {
    render: function () {
      var dash = '<div class="arch-dash">' + box('dashboard', L(A.dashboard.title), t('how.dashLine'), 'abox-dash', 'home') +
        '<ul class="dash-parts">' + A.dashboard.parts.map(function (p, i) { return '<li>' + box('dp' + i, L(p), t('how.dashLine'), 'abox-chip') + '</li>'; }).join('') + '</ul></div>';
      var makers = '<div class="arch-makers">' + flowBox('posters') + flowBox('reels') + '</div>';
      var plats = '<div class="arch-plats">' + flowBox('platforms') + '<ul class="arch-plat-list">' + D.platforms.map(function (p) { return '<li>' + MOS.plat(p.id, { cls: 'plat-sm' }) + '</li>'; }).join('') + '</ul></div>';
      var arrow = '<span class="arch-arrow" aria-hidden="true">' + icon('chevron', 'flip') + '</span>';
      var flow = '<div class="arch-flow">' + flowBox('brand') + arrow + makers + arrow + flowBox('approve') + arrow + flowBox('service') + arrow + plats + '</div>' +
        '<div class="arch-return" aria-hidden="true"><span class="ar-line"></span><span class="ar-label">' + esc(t('how.back')) + '</span></div>';
      var kit = '<div class="arch-brain">' + box('kit', t('how.kit'), t('how.kitLine'), 'abox-brain', 'brand', t('how.kitLine')) +
        '<ul class="brain-parts">' + A.kit.map(function (b, i) { return '<li>' + box('kit' + i, L(b), t('how.kitLine'), 'abox-chip') + '</li>'; }).join('') + '</ul></div>';
      var engines = '<div class="arch-engines"><h3 class="h-sub">' + esc(t('how.engines')) + '</h3><ul>' + A.engines.map(function (e) {
        return '<li>' + box('eng-' + e.id, L(e.name), L(e.role), 'abox-engine', null, L(e.role)) + '</li>';
      }).join('') + '</ul></div>';
      var platform = '<div class="arch-platform"><p>' + esc(L(A.platform)) + '</p></div>';
      return MOS.simpleHead(t('how.eyebrow'), t('how.title'), L(D.meta.scope)) +
        '<div class="arch-bar"><p class="arch-explain" id="arch-explain" aria-live="polite"><span class="ae-t">' + esc(t('how.hint')) + '</span></p></div>' +
        '<div class="arch arch2" data-tour="arch">' + dash + flow + kit + engines + platform + '</div>';
    },
    mount: function (root) {
      root.querySelectorAll('.abox').forEach(function (b) {
        b.addEventListener('mouseenter', function () { explain(b); });
        b.addEventListener('focus', function () { explain(b); });
      });
    }
  };

  function explain(b) {
    var el = document.getElementById('arch-explain');
    if (!el) return;
    el.innerHTML = '<span class="ae-title">' + esc(b.getAttribute('data-title')) + '</span><span class="ae-t">' + esc(b.getAttribute('data-line')) + '</span>';
    document.querySelectorAll('.abox.is-on').forEach(function (x) { x.classList.remove('is-on'); });
    b.classList.add('is-on');
  }
  MOS.actions['how-explain'] = function (el) { explain(el); };
})();

</script>
</body>
</html>
